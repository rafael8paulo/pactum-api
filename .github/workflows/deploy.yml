name: Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw test -B

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy no Dokploy
        env:
          DOKPLOY_URL: https://deploy.rpx.dev.br
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          APP_ID: R9hYYIker42ZJmL0GTFxm
        run: |
          set -euo pipefail
          api() { curl -fsS -H "x-api-key: $DOKPLOY_TOKEN" -H 'Content-Type: application/json' "$@"; }
          latest() {
            api "$DOKPLOY_URL/api/deployment.all?applicationId=$APP_ID" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['deploymentId'], d[0]['status']) if d else print()"
          }
          prev=$(latest || echo); prev=${prev%% *}
          api -X POST "$DOKPLOY_URL/api/application.deploy" -d "{\"applicationId\":\"$APP_ID\"}" > /dev/null
          echo "Deploy disparado no Dokploy (app $APP_ID)."
          for _ in $(seq 1 90); do
            sleep 8
            line=$(latest || echo)
            id=${line%% *}; status=${line##* }
            if [ -n "$id" ] && [ "$id" != "$prev" ]; then
              echo "deployment $id -> ${status:-?}"
              if [ "$status" = "done" ]; then echo "Deploy concluído."; exit 0; fi
              if [ "$status" = "error" ]; then
                echo "::error::Deploy falhou no Dokploy"
                api "$DOKPLOY_URL/api/deployment.readLogs?deploymentId=$id&tail=60" || true
                exit 1
              fi
            fi
          done
          echo "::error::Timeout aguardando o Dokploy concluir o deploy"
          exit 1
